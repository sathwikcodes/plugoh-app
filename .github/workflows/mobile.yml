name: Mobile CI/CD
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/mobile.yml
      - .eas/workflows/**
      - app.json
      - eas.json
      - package.json
      - package-lock.json
      - apps/mobile/**
      - packages/contracts/**
      - packages/config/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/mobile.yml
      - .eas/workflows/**
      - app.json
      - eas.json
      - package.json
      - package-lock.json
      - apps/mobile/**
      - packages/contracts/**
      - packages/config/**
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run mobile tests with coverage
        run: npm run mobile:test:coverage

      - name: Run Expo doctor
        run: npm run mobile:doctor

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
