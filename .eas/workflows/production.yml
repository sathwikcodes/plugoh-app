name: mobile-production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mobile_checks:
    name: Mobile lint and typecheck
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Mobile lint
        run: npm run mobile:lint
      - name: Mobile typecheck
        run: npm run typecheck

  build_android_production:
    name: Build Android Production
    needs: [mobile_checks]
    type: build
    params:
      platform: android
      profile: production

  build_ios_production:
    name: Build iOS Production
    needs: [mobile_checks]
    type: build
    params:
      platform: ios
      profile: production

  submit_android_production:
    name: Submit Android Production
    needs: [build_android_production]
    type: submit
    params:
      profile: production
      build_id: ${{ needs.build_android_production.outputs.build_id }}

  submit_ios_production:
    name: Submit iOS Production
    needs: [build_ios_production]
    type: submit
    params:
      profile: production
      build_id: ${{ needs.build_ios_production.outputs.build_id }}
