name: mobile-preview

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  mobile_checks:
    name: Mobile lint and typecheck
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Mobile lint
        run: npm run mobile:lint
      - name: Mobile typecheck
        run: npm run typecheck

  build_android_preview:
    name: Build Android Preview
    needs: [mobile_checks]
    type: build
    params:
      platform: android
      profile: preview

  build_ios_preview:
    name: Build iOS Preview
    needs: [mobile_checks]
    type: build
    params:
      platform: ios
      profile: preview
